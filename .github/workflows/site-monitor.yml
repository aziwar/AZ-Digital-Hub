name: Site monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: site-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Run production checks
        id: checks
        continue-on-error: true
        run: |
          set -o pipefail
          bash .github/scripts/site-check.sh https://www.zewar.xyz | tee site-check.log

      - name: Open, update or close the site-monitor issue
        uses: actions/github-script@v7
        env:
          OK: ${{ steps.checks.outputs.ok }}
          FAILED: ${{ steps.checks.outputs.failed }}
        with:
          script: |
            const fs = require('fs');
            const label = 'site-monitor';
            const ok = process.env.OK === 'true';
            const failed = (process.env.FAILED || 'monitor-script').trim() || 'monitor-script';
            const log = fs.existsSync('site-check.log') ? fs.readFileSync('site-check.log', 'utf8').slice(-6000) : '(no log)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'd73a4a', description: 'Automated production site checks' });
            }

            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: label, per_page: 100 });
            const existing = open.find((i) => !i.pull_request);
            const body = `${ok ? 'Recovered' : 'Failing'} at ${new Date().toISOString()} ([run](${runUrl}))\n\n\`\`\`\n${log}\n\`\`\``;

            if (ok) {
              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `All checks passing again. ${body}` });
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
                core.info(`Closed #${existing.number}`);
              }
              return;
            }

            const title = `Site check failing: ${failed.split(/\s+/).join(', ')}`;
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              if (existing.title !== title) await github.rest.issues.update({ owner, repo, issue_number: existing.number, title });
              core.info(`Commented on #${existing.number}`);
            } else {
              const { data } = await github.rest.issues.create({ owner, repo, title, labels: [label], body });
              core.info(`Opened #${data.number}`);
            }
            core.setFailed(title);
