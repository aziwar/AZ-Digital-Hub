name: auto-merge

# Codex edits its summary comment when a review finishes; the `Codex review` commit status below (required by the ruleset
# together with `build`) is kept exactly as it was.
# Auto-merge arming changed on 2026-11-02 (owner approval 12:43 KWT, Rahmi ticket 7398cd8d): scripts/automerge-reconcile.sh arms
# GitHub native auto-merge only when the owner account commented "lens-verdict: <fable|astra> PASS <full head sha>" on the
# EXACT current head for the lenses the risk label needs (risk:LOW none, risk:NORMAL fable, risk:HIGH fable + astra; no risk
# label counts as NORMAL), and disarms on every new push (GitHub itself disarms only for pushers without write permission),
# on a hold label, when the PR goes back to draft, and when an owner comment is edited or DELETED (revocation). Every decision is
# also posted as the commit status `lens-gate` on the exact head; making `lens-gate` a REQUIRED status in the ruleset is what turns
# this into a server-enforced gate (a new head has no status until the workflow posts one; command in the PR body). A scheduled sweep
# re-evaluates every open PR. Dependabot PRs keep the Codex-review gate only, are never armed here, and get lens-gate=success.
# The script is checked out from the default branch, never from the PR head; PRs with another base branch are not armed.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: read
  statuses: write

jobs:
  gate:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
       contains(github.event.comment.body, '<!-- codex-pull-request-review-summary -->')) ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == 'aziwar')
    concurrency:
      group: auto-merge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check review of current head
        id: review
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request?.number ?? context.issue.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.state !== 'open') return;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            const summary = comments.find(comment =>
              comment.user.login === 'chatgpt-codex-connector[bot]' &&
              comment.body.includes('<!-- codex-pull-request-review-summary -->'));
            const match = summary?.body.match(/<!-- codex-review-state:v1 (\{[^\n]*\}) -->/);
            let review;
            if (match) {
              try { review = JSON.parse(match[1]).code_review; } catch { /* fail closed */ }
            }

            const held = pr.labels.some(label =>
              ['no-automerge', 'needs:owner-yes'].includes(label.name));
            const clean = review?.status === 'completed' &&
              review.commit_sha === pr.head.sha &&
              review.has_any_findings === false &&
              review.has_unresolved_findings === false;
            const findings = review?.status === 'completed' &&
              review.commit_sha === pr.head.sha &&
              (review.has_any_findings === true || review.has_unresolved_findings === true);
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha,
              context: 'Codex review',
              state: clean ? 'success' : findings ? 'failure' : 'pending',
              description: clean ? 'Clean Codex review of this head' :
                findings ? 'Codex review has findings' : 'Waiting for clean Codex review of this head',
              target_url: summary?.html_url ?? pr.html_url,
            });
            const enable = !pr.draft && pr.user.login !== 'dependabot[bot]' && !held && clean;
            core.setOutput('action', enable ? 'enable' : 'disable');
            core.setOutput('dependabot', String(pr.user.login === 'dependabot[bot]'));
            core.setOutput('base_ok', String(pr.base.ref === context.payload.repository.default_branch));
            core.setOutput('sha', pr.head.sha);
            core.setOutput('url', pr.html_url);

      - name: Check out the default branch (never the PR head)
        if: steps.review.outputs.action != '' && steps.review.outputs.base_ok == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Arm or disarm auto-merge from the lens verdicts
        if: steps.review.outputs.action != '' && steps.review.outputs.dependabot != 'true' && steps.review.outputs.base_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.review.outputs.url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER_LOGIN: aziwar
        run: bash scripts/automerge-reconcile.sh "$PR_URL"

      - name: Dependabot PR is never armed here (disarm if it was) and gets lens-gate success
        if: steps.review.outputs.action != '' && steps.review.outputs.dependabot == 'true' && steps.review.outputs.base_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.review.outputs.url }}
          HEAD_SHA: ${{ steps.review.outputs.sha }}
        run: |
          bash scripts/lens-gate-status.sh "$HEAD_SHA" success "dependabot PR, never armed by the lens gate"
          if [ "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')" = true ]; then
            gh pr merge --disable-auto "$PR_URL"
          fi

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: auto-merge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Re-evaluate every open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER_LOGIN: aziwar
        run: bash scripts/automerge-sweep.sh
